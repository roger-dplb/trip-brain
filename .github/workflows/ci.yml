name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-quality:
    name: Python Lint/Format (backend + worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint backend and worker
        run: ruff check backend/app worker/app

      - name: Check formatting backend and worker
        run: ruff format --check backend/app worker/app

  frontend-quality:
    name: Frontend Lint/Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build app
        run: npm run build
