<!-- worker/app/stories/templates/slide-media.html -->
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px;
    background: #000;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    color: #fff; overflow: hidden; position: relative;
  }
  .bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
  }
  .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0.2) 0%,
      transparent 40%,
      rgba(0,0,0,0.6) 100%
    );
  }
  .top-label {
    position: absolute; top: 80px; left: 70px;
    font-size: 24px; letter-spacing: 4px; opacity: 0.7;
    text-transform: uppercase; font-weight: 500;
  }
  .caption {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 60px 70px 100px;
    font-size: 52px; font-weight: 500; line-height: 1.3;
  }
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="overlay"></div>
<div class="top-label" id="top-label"></div>
<div class="caption" id="caption"></div>
<script>
  const data = window.__DATA__ || {};

  if (data.media_url) {
    document.getElementById('bg').style.backgroundImage = `url('${data.media_url}')`;
  }

  document.getElementById('top-label').textContent =
    `DIA ${data.day_number || ''} · ${(data.day_city || '').toUpperCase()}`;

  if (data.media_caption) {
    document.getElementById('caption').textContent = data.media_caption;
  }
</script>
</body>
</html>
