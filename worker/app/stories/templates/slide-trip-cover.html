<!-- worker/app/stories/templates/slide-trip-cover.html -->
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    color: #fff; overflow: hidden; position: relative;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  }
  .bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
  }
  .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.5) 100%);
  }
  .top-label {
    position: absolute; top: 80px; left: 70px;
    font-size: 22px; letter-spacing: 5px; opacity: 0.3;
    text-transform: uppercase;
  }
  .bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 60px 70px 100px;
    display: flex; flex-direction: column; gap: 24px;
  }
  .accent-bar {
    width: 100px; height: 6px;
    background: #ff6b6b; border-radius: 3px;
  }
  .trip-name {
    font-size: 110px; font-weight: 900; line-height: 1;
    letter-spacing: -3px;
    text-shadow: 0 4px 30px rgba(0,0,0,0.5);
  }
  .sub {
    font-size: 32px; opacity: 0.6; letter-spacing: 4px;
    text-transform: uppercase; font-weight: 400;
  }
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="overlay"></div>
<div class="top-label">trip-brain</div>
<div class="bottom">
  <div class="accent-bar"></div>
  <div class="trip-name" id="trip-name"></div>
  <div class="sub">sua viagem</div>
</div>
<script>
  const data = window.__DATA__ || {};
  if (data.trip_cover_url) {
    document.getElementById('bg').style.backgroundImage = `url('${data.trip_cover_url}')`;
  }
  document.getElementById('trip-name').textContent = data.trip_name || '';
</script>
</body>
</html>
