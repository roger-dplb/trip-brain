<!-- worker/app/stories/templates/slide-cover.html -->
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    color: #fff; overflow: hidden; position: relative;
    background: #0f3460;
  }
  .bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
  }
  .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.5) 100%);
  }
  .top {
    position: absolute; top: 80px; left: 70px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .trip-label {
    font-size: 20px; letter-spacing: 5px; opacity: 0.5;
    text-transform: uppercase;
  }
  .day-label {
    font-size: 24px; letter-spacing: 5px; opacity: 0.7;
    text-transform: uppercase; font-weight: 500;
  }
  .bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 60px 70px 100px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .accent-bar {
    width: 80px; height: 6px;
    background: #ff6b6b; border-radius: 3px;
  }
  .date {
    font-size: 100px; font-weight: 900; line-height: 1;
    letter-spacing: -2px;
    text-shadow: 0 4px 30px rgba(0,0,0,0.4);
  }
  .location {
    font-size: 38px; font-weight: 600; opacity: 0.9;
  }
  .stats {
    font-size: 26px; opacity: 0.45; letter-spacing: 3px;
    text-transform: uppercase; margin-top: 8px;
  }
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="overlay"></div>
<div class="top">
  <div class="trip-label" id="trip-label"></div>
  <div class="day-label" id="day-label"></div>
</div>
<div class="bottom">
  <div class="accent-bar"></div>
  <div class="date" id="date"></div>
  <div class="location" id="location"></div>
  <div class="stats" id="stats"></div>
</div>
<script>
  const data = window.__DATA__ || {};

  if (data.hero_photo_url) {
    document.getElementById('bg').style.backgroundImage = `url('${data.hero_photo_url}')`;
  }

  document.getElementById('trip-label').textContent = data.trip_name || '';
  document.getElementById('day-label').textContent = `DIA ${data.day_number || ''}`;

  // Brazilian date format: DD/MM/YYYY
  let dateLabel = data.day_date || '';
  if (dateLabel && dateLabel.includes('-')) {
    const parts = dateLabel.split('-');
    if (parts.length === 3) dateLabel = `${parts[2]}/${parts[1]}/${parts[0]}`;
  }
  document.getElementById('date').textContent = dateLabel;

  const loc = [data.day_city, data.day_country].filter(Boolean).join(', ');
  if (loc) document.getElementById('location').textContent = `📍 ${loc}`;

  document.getElementById('stats').textContent =
    `${data.total_activities || 0} atividades · ${data.total_photos || 0} fotos`;
</script>
</body>
</html>
